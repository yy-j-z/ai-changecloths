services:
  mysql:
    image: mysql:8.4
    container_name: ai-fitting-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_fitting
      MYSQL_USER: ai_fitting
      MYSQL_PASSWORD: ai_fitting_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:

